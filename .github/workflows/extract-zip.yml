name: Extract Electronics ZIP

on:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"
      - ".github/workflows/extract-zip.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract website ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          mkdir -p /tmp/electronics-site
          unzip -o "$ZIP_FILE" -d /tmp/electronics-site

          SOURCE="/tmp/electronics-site"
          ITEMS=$(find "$SOURCE" -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$ITEMS" -eq 1 ] && \
             [ -d "$(find "$SOURCE" -mindepth 1 -maxdepth 1)" ]; then
            SOURCE=$(find "$SOURCE" -mindepth 1 -maxdepth 1)
          fi

          cp -a "$SOURCE"/. .

          if [ ! -f package.json ]; then
            echo "ERROR: package.json not found at repository root."
            find . -maxdepth 3 -name package.json
            exit 1
          fi

          echo "Website files extracted successfully."
          ls -la

      - name: Commit website files
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git reset -- .github/workflows/

          if ! git diff --cached --quiet; then
            git commit -m "Extract electronics website files"
            git push origin HEAD:main
          else
            echo "No website changes to comm it."
          fi
